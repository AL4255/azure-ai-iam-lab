#cloud-config

package_update: true
package_upgrade: true

packages:
  - jq
  - python3-venv:
  - unattended-upgrades

runcmd:
  - curl -fsSL https://ollama.com/install.sh -o /tmp/ollama-install.sh
  - sh /tmp/ollama-install.sh
  - timeout 120 sh -c 'until curl -s https://127/0.0.1:11434 >/dev/null; do sleep 2; done'
  - HOME=/root ollama pull qwen2.5:1.5b
  - echo "cloud-initinit finished at $(date)" > /var/log/lab-ready.txt
